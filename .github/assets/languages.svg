<svg xmlns="http://www.w3.org/2000/svg" width="340" height="195" viewBox="0 0 340 195" fill="none">
  <style>
    .header { font: 700 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #38bdf8; }
    .lang-name { font: 600 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #f8fafc; }
    .lang-pct { font: 500 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #94a3b8; }
  </style>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="339" height="194" rx="14" fill="#0d1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- Title -->
  <g transform="translate(24, 32)">
    <circle cx="6" cy="6" r="6" fill="#38bdf8" opacity="0.2"/>
    <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
    <text x="22" y="11" class="header">Most Used Languages</text>
  </g>

  <!-- Stacked Progress Bar (width: 292px) -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="292" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <!-- Dart: 44.5% = 130px -->
    <rect x="0" y="0" width="130" height="10" rx="5" fill="#00b4d8"/>
    <!-- JavaScript: 27.5% = 80px -->
    <rect x="130" y="0" width="80" height="10" fill="#f7df1e"/>
    <!-- React / TS: 15% = 44px -->
    <rect x="210" y="0" width="44" height="10" fill="#3178c6"/>
    <!-- HTML/CSS: 8.5% = 25px -->
    <rect x="254" y="0" width="25" height="10" fill="#e34c26"/>
    <!-- Other: 4.5% = 13px -->
    <rect x="279" y="0" width="13" height="10" rx="5" fill="#8b5cf6"/>
  </g>

  <!-- Legend List -->
  <g transform="translate(24, 94)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="4.5" fill="#00b4d8"/>
      <text x="18" y="10" class="lang-name">Dart <tspan class="lang-pct">44.5%</tspan></text>
    </g>
    <g transform="translate(0, 26)">
      <circle cx="6" cy="6" r="4.5" fill="#f7df1e"/>
      <text x="18" y="10" class="lang-name">JavaScript <tspan class="lang-pct">27.5%</tspan></text>
    </g>
    <g transform="translate(0, 52)">
      <circle cx="6" cy="6" r="4.5" fill="#3178c6"/>
      <text x="18" y="10" class="lang-name">TypeScript <tspan class="lang-pct">15.0%</tspan></text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(160, 0)">
      <circle cx="6" cy="6" r="4.5" fill="#e34c26"/>
      <text x="18" y="10" class="lang-name">HTML/CSS <tspan class="lang-pct">8.5%</tspan></text>
    </g>
    <g transform="translate(160, 26)">
      <circle cx="6" cy="6" r="4.5" fill="#8b5cf6"/>
      <text x="18" y="10" class="lang-name">Other <tspan class="lang-pct">4.5%</tspan></text>
    </g>
  </g>
</svg>
