<svg xmlns="http://www.w3.org/2000/svg" width="460" height="195" viewBox="0 0 460 195" fill="none">
  <style>
    .header { font: 700 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #38bdf8; }
    .stat-label { font: 500 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #94a3b8; }
    .stat-value { font: 700 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #f8fafc; }
    .bold-ring { font: 800 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #ffffff; }
    .ring-sub { font: 600 10px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #38bdf8; letter-spacing: 1px; }
  </style>
  
  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="459" height="194" rx="14" fill="#0d1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- Title -->
  <g transform="translate(24, 32)">
    <circle cx="6" cy="6" r="6" fill="#38bdf8" opacity="0.2"/>
    <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
    <text x="22" y="11" class="header">GitHub Activity Stats</text>
  </g>

  <!-- Left Stats List -->
  <g transform="translate(24, 68)">
    <!-- Total Contributions -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="3" fill="#6366f1"/>
      <text x="20" y="10" class="stat-label">Total Contributions:</text>
      <text x="220" y="10" text-anchor="end" class="stat-value">282</text>
    </g>
    <!-- Total Commits -->
    <g transform="translate(0, 26)">
      <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
      <text x="20" y="10" class="stat-label">Commits (Current Year):</text>
      <text x="220" y="10" text-anchor="end" class="stat-value">278</text>
    </g>
    <!-- Repositories -->
    <g transform="translate(0, 52)">
      <circle cx="6" cy="6" r="3" fill="#10b981"/>
      <text x="20" y="10" class="stat-label">Public Repositories:</text>
      <text x="220" y="10" text-anchor="end" class="stat-value">15+</text>
    </g>
    <!-- Pull Requests -->
    <g transform="translate(0, 78)">
      <circle cx="6" cy="6" r="3" fill="#fbbf24"/>
      <text x="20" y="10" class="stat-label">Pull Requests &amp; Reviews:</text>
      <text x="220" y="10" text-anchor="end" class="stat-value">8</text>
    </g>
  </g>

  <!-- Right Ring Widget: 99% Commits Focus -->
  <g transform="translate(350, 115)">
    <!-- Background Track -->
    <circle cx="0" cy="0" r="46" stroke="rgba(255, 255, 255, 0.06)" stroke-width="8" fill="none"/>
    <!-- Progress Arc (99%) -->
    <circle cx="0" cy="0" r="46" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"
      stroke-dasharray="289" stroke-dashoffset="3" transform="rotate(-90)"/>
    <text x="0" y="2" text-anchor="middle" class="bold-ring">99%</text>
    <text x="0" y="18" text-anchor="middle" class="ring-sub">COMMITS</text>
  </g>
</svg>
